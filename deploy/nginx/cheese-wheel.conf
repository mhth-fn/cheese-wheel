server {
    listen 8080;
    server_name cheese-wheel.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name cheese-wheel.ru;

    ssl_certificate     /etc/nginx/ssl/cheese-wheel.pem;
    ssl_certificate_key /etc/nginx/ssl/cheese-wheel.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SIGame packages can be up to 200 MiB. Stream this one authenticated
    # upload endpoint instead of buffering the whole request in Nginx.
    location = /api/sigame-packs {
        client_max_body_size 200m;
        proxy_request_buffering off;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # `$remote_addr` is rewritten from CF-Connecting-IP only when the
        # immediate peer belongs to a trusted Cloudflare range. Replace,
        # rather than append, inbound forwarding headers to prevent spoofing.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
