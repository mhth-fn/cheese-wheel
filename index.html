<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сырное Колесо</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    var t = localStorage.getItem('theme');
    var browserThemeColors = {
      cheese: '#f8dc78',
      newyear: '#1a472a',
      spring: '#e8f5e9'
    };
    var browserThemeColor = browserThemeColors[t] || browserThemeColors.cheese;
    document.documentElement.style.backgroundColor = browserThemeColor;
    if (t === 'newyear') document.body.classList.add('theme-newyear');
    else if (t === 'spring') document.body.classList.add('theme-spring');
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
