<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧀 Сырное Колесо Фильмов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/theme-newyear.css">
  <link rel="stylesheet" href="/css/theme-spring.css">
  <link rel="stylesheet" href="/css/toast.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/wheel.css">
  <link rel="stylesheet" href="/css/movies.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/watched.css">
  <link rel="stylesheet" href="/css/stats.css">
  <link rel="stylesheet" href="/css/connection.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Снег (для новогодней темы) -->
  <div class="snowflakes" id="snowflakes"></div>

  <!-- Гирлянды (для новогодней темы) -->
  <div class="garland">
    <div class="garland-lights" id="garland-lights"></div>
  </div>

  <!-- Лепестки (для весенней темы) -->
  <div class="petals" id="petals"></div>

  <!-- Кнопка админ-панели (только для Сергея) -->
  <button class="admin-btn" id="admin-btn" title="Админ-панель">⚙️</button>

  <!-- Модальное окно админ-панели -->
  <div class="admin-modal" id="admin-modal">
    <div class="admin-modal-content">
      <h2 class="admin-modal-title">⚙️ Админ-панель</h2>
      <div class="theme-selector">
        <div class="theme-option" data-theme="cheese">
          <span class="theme-option-icon">🧀</span>
          <div class="theme-option-info">
            <div class="theme-option-name">Сырная тема</div>
            <div class="theme-option-desc">Жёлто-оранжевый дизайн</div>
          </div>
          <span class="theme-option-check">✓</span>
        </div>
        <div class="theme-option" data-theme="newyear">
          <span class="theme-option-icon">🎄</span>
          <div class="theme-option-info">
            <div class="theme-option-name">Новогодняя тема</div>
            <div class="theme-option-desc">Снег, гирлянды, красно-зелёный</div>
          </div>
          <span class="theme-option-check">✓</span>
        </div>
        <div class="theme-option" data-theme="spring">
          <span class="theme-option-icon">🌸</span>
          <div class="theme-option-info">
            <div class="theme-option-name">Весенняя тема</div>
            <div class="theme-option-desc">Лепестки, зелёно-розовый дизайн</div>
          </div>
          <span class="theme-option-check">✓</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Страница авторизации -->
  <div id="auth-page" class="page auth-page active">
    <div class="auth-logo">🧀</div>
    <h1 class="auth-title">Сырное Колесо</h1>
    <p class="auth-subtitle">Выбери себя</p>
    <div class="auth-users" id="auth-users"></div>
    <div class="auth-password-container" id="auth-password-container" style="display: none;">
      <input type="password" class="auth-password-input" id="auth-password" placeholder="Введите пароль...">
      <button class="auth-password-btn" id="auth-password-btn">Войти</button>
      <p class="auth-error" id="auth-error"></p>
    </div>
    <button class="auth-guest-btn" id="auth-guest-btn">👀 Войти как гость</button>
  </div>

  <!-- Toast контейнер -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Страница колеса -->
  <div id="wheel-page" class="page wheel-page">
    <nav class="nav" id="nav-wheel"></nav>

    <div class="wheel-container">
      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <div id="wheel"></div>
      </div>
      <div class="spin-controls">
        <button class="spin-btn" id="spin-btn">🎲 Крутить!</button>
        <div class="spin-duration guest-hidden">
          <label>⏱️ Время:</label>
          <input type="number" id="spin-duration-input" min="5" max="15" value="5">
          <span>сек</span>
        </div>
      </div>
    </div>

    <div class="add-movie guest-hidden">
      <h3>🎬 Фильмы в колесе </h3>
      <form class="add-movie-form" id="add-movie-form">
        <input type="text" class="add-movie-input" id="movie-input" placeholder="Название фильма..." maxlength="100">
        <button type="submit" class="add-movie-btn">Добавить</button>
      </form>
      <div class="movie-list" id="movie-list"></div>
    </div>
  </div>

  <!-- Страница просмотренных -->
  <div id="watched-page" class="page watched-page">
    <nav class="nav" id="nav-watched"></nav>

    <h2 class="watched-title">🎬 Просмотренные фильмы</h2>

    <!-- Статистика -->
    <div class="stats-panel" id="stats-panel"></div>

    <!-- Поиск -->
    <div class="search-bar" id="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Поиск фильма...">
      <button class="search-clear" id="search-clear">✕</button>
    </div>

    <div class="watched-table-wrapper">
      <div id="watched-content"></div>
    </div>

    <div class="watched-add-movie guest-hidden">
      <h3>🎬 Добавить фильм в просмотренные</h3>
      <form class="add-movie-form" id="watched-add-movie-form">
        <input type="text" class="add-movie-input" id="watched-movie-input" placeholder="Название фильма..." maxlength="100">
        <button type="submit" class="add-movie-btn">Добавить</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно результата -->
  <div class="modal" id="result-modal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <h3 class="modal-title">Выпал фильм!</h3>
      <div class="modal-movie" id="modal-movie-title"></div>
      <button class="modal-btn" id="modal-close-btn">Отлично! 👤</button>
    </div>
  </div>

  <!-- Индикатор подключения -->
  <div class="connection-status">
    <div class="connection-dot" id="connection-dot"></div>
    <span id="connection-text">Отключено</span>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
